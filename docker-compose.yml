services:
  db:
    image: postgres:17
    restart: 'no'
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql/data
  test-db:
    image: postgres:17
    profiles: [test]
    restart: 'no'
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rezeptly_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d rezeptly_test']
      interval: 1s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
